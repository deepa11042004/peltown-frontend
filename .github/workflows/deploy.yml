name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Image
        run: |
          docker build -t deepacode/peltown-frontend:latest .

      - name: Push Image
        run: |
          docker push deepacode/peltown-frontend:latest

      - name: Deploy VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker pull deepacode/peltown-frontend:latest

            docker stop peltown-frontend || true
            docker rm peltown-frontend || true

            docker run -d \
              --name peltown-frontend \
              --restart unless-stopped \
              -p 4000:4000 \
              deepacode/peltown-frontend:latest